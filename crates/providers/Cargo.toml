[package]
name = "providers"
description = "GraphProvider trait and Gremlin Server / Neptune providers (ADR-0015)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gremlin-client.workspace = true
gremlin-model.workspace = true
gremlin-syntax.workspace = true
schema.workspace = true
storage.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
url.workspace = true
log.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-runtime.workspace = true
aws-sigv4.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
http.workspace = true
reqwest.workspace = true
toml.workspace = true

# Test doubles for this crate's and other crates' tests (feature `testing`).
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
quick-xml = { workspace = true }

[features]
testing = ["dep:hmac", "dep:sha2", "dep:hex", "dep:rcgen", "dep:tokio-rustls", "dep:rustls", "dep:tokio-tungstenite"]

[dev-dependencies]
providers = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
gremlin-client = { workspace = true, features = ["testenv"] }

[lints]
workspace = true
