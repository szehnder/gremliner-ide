[package]
name = "gremlin-client"
description = "TinkerPop WebSocket wire client (ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gremlin-model.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
indexmap.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
http.workspace = true
simd-json.workspace = true
rustls.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
# Self dev-dependency so integration tests can use the `testenv` helpers.
gremlin-client = { path = ".", features = ["testenv"] }

[features]
# Test helpers for other crates' integration tests: `gremlin-client = { workspace = true, features = ["testenv"] }`.
testenv = []

[lints]
workspace = true
