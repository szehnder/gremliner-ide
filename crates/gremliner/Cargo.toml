[package]
name = "gremliner"
description = "Gremliner IDE desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/szehnder/gremliner-ide"

[dependencies]
gpui-kit.workspace = true
ui-workspace.workspace = true
graph-canvas.workspace = true
graph-store.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
tokio.workspace = true
storage.workspace = true

[lints]
workspace = true

[dev-dependencies]
providers.workspace = true

# Installers (ADR-0040). `cargo xtask package` passes the formats for the host OS; see xtask/src/package.rs.
[package.metadata.packager]
productName = "Gremliner"
identifier = "io.github.szehnder.gremliner"
publisher = "Gremliner contributors"
# The .deb Maintainer field.
authors = ["Gremliner contributors <szehnder@users.noreply.github.com>"]
category = "DeveloperTool"
copyright = "Copyright 2026 Gremliner contributors. Apache-2.0."
licenseFile = "../../LICENSE"
# macOS .icns accepts 1024 px only as a 2x image, named with @2x (icns IconType table).
icons = ["../../assets/icon/png/32x32.png", "../../assets/icon/png/64x64.png", "../../assets/icon/png/128x128.png", "../../assets/icon/png/256x256.png", "../../assets/icon/png/512x512.png", "../../assets/icon/png/512x512@2x.png"]
longDescription = "A native desktop IDE for Gremlin (Apache TinkerPop): graph view, step-through debugger, schema-checked natural-language assistant, Gremlin Server and Amazon Neptune."
binaries = [{ path = "gremliner", main = true }, { path = "gremliner-cli", main = false }]

[package.metadata.packager.deb]
# Linked libraries (ldd) plus the Vulkan loader wgpu opens at run time.
depends = ["libdbus-1-3", "libxcb1", "libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1"]
section = "devel"
# Adds StartupWMClass (matches the window app_id) and search keywords; the AppImage uses it too.
desktopTemplate = "../../packaging/linux/gremliner.desktop"

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"

[package.metadata.packager.nsis]
installMode = "currentUser"
