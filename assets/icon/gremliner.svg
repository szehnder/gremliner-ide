<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Gremliner app icon: a small traversal (highlighted path) through a graph, on the brand green. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9466"/>
      <stop offset="1" stop-color="#075a3e"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="28" stroke-linecap="round">
    <line x1="300" y1="330" x2="560" y2="250"/>
    <line x1="300" y1="330" x2="330" y2="660"/>
    <line x1="560" y1="250" x2="740" y2="470"/>
    <line x1="330" y1="660" x2="740" y2="470"/>
  </g>
  <g stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="300,330 520,520 740,470 640,760"/>
  </g>
  <g fill="#ffffff">
    <circle cx="560" cy="250" r="54" fill-opacity="0.6"/>
    <circle cx="330" cy="660" r="54" fill-opacity="0.6"/>
    <circle cx="520" cy="520" r="66"/>
    <circle cx="740" cy="470" r="66"/>
  </g>
  <circle cx="300" cy="330" r="86" fill="#ffffff"/>
  <circle cx="300" cy="330" r="40" fill="#0b7a55"/>
  <circle cx="640" cy="760" r="86" fill="#f5b942"/>
</svg>
